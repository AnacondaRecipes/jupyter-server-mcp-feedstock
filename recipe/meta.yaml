{% set name = "jupyter-server-mcp" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-','_') }}-{{ version }}.tar.gz
  sha256: 41392496ced1d8de441fbcfff7c31b3fc2767abaa350e25660bbcc8aa5c8a9ae

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - hatchling >=1.5
  run:
    - python
    - fastmcp >=3
    - jupyter_server >=1.6,<3

test:
  source_files:
    - tests
  imports:
    - jupyter_server_mcp
  requires:
    - pip
    - pytest >=7.0
    - pytest-asyncio >=0.21.0
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv tests

about:
  homepage: https://github.com/jupyter-ai-contrib/jupyter-server-mcp
  summary: "An MCP interface/extension for Jupyter Server"
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://jupyter-ai.readthedocs.io/
  repository: https://github.com/jupyter-ai-contrib/jupyter-server-mcp

extra:
  recipe-maintainers:
    - dlqqq
    - andrii-i
